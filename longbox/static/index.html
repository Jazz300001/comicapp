<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Longbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c1553c'/%3E%3Ctext x='16' y='24' font-size='20' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3EL%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">Longbox</a>
  <div id="stats" class="stats" aria-live="polite"></div>
  <button id="rescan" class="btn" type="button">Rescan library</button>
</header>

<section id="library-controls" class="controls" hidden>
  <div class="field field-search">
    <label for="q">Search</label>
    <input id="q" type="search" autocomplete="off" placeholder="series, title, writer, character">
  </div>
  <div class="field">
    <label for="series">Series</label>
    <select id="series"><option value="">All series</option></select>
  </div>
  <div class="field">
    <label for="year">Year</label>
    <select id="year"><option value="">All years</option></select>
  </div>
  <div class="field">
    <label for="read">Read state</label>
    <select id="read">
      <option value="">Read and unread</option>
      <option value="false">Unread only</option>
      <option value="true">Read only</option>
    </select>
  </div>
  <div class="field">
    <label for="status">File state</label>
    <select id="status">
      <option value="">All files</option>
      <option value="error">Unreadable files</option>
      <option value="missing">Missing files</option>
    </select>
  </div>
  <div class="field">
    <label for="sort">Sort by</label>
    <select id="sort">
      <option value="series">Series, then issue</option>
      <option value="issue">Issue number</option>
      <option value="year">Year (newest first)</option>
      <option value="title">Title</option>
      <option value="added">Recently added</option>
      <option value="indexed">Recently indexed</option>
    </select>
  </div>
  <button id="clear-filters" class="btn btn-quiet" type="button">Clear filters</button>
</section>

<main id="view" class="view" aria-live="polite"></main>

<div id="toast" class="toast" role="status" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
